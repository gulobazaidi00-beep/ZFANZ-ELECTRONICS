name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - run: |
          flutter create . --platforms=android --project-name zfanz_electronics --org com.zfanz.electronics
          # REPLACE ICON WITH YOURS IF EXISTS
          if [ -f "assets/icon.png" ]; then
            for d in android/app/src/main/res/mipmap-*; do
              cp assets/icon.png $d/ic_launcher.png
              cp assets/icon.png $d/launcher_icon.png || true
            done
          fi
          # FIX APP NAME
          sed -i 's/android:label="[^"]*"/android:label="ZFANZ ELECTRONICS"/' android/app/src/main/AndroidManifest.xml || true
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: zfanz-apk
          path: build/app/outputs/flutter-apk/app-release.apk
