name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - run: |
          # 1. Create android folder if missing
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --project-name zfanz_electronics --org com.zfanz.electronics
          fi
          # 2. Add INTERNET permission for videos
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "INTERNET" "$MANIFEST"; then
            sed -i 's/<manifest.*>/&\n    <uses-permission android:name="android.permission.INTERNET" \/>/' "$MANIFEST"
          fi
          # 3. Copy your ZFANZ icon if you have it
          if [ -f "assets/icon.png" ]; then
            cp assets/icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png || true
            cp assets/icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png || true
            cp assets/icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png || true
            cp assets/icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
            cp assets/icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true
          fi
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: zfanz-apk
          path: build/app/outputs/flutter-apk/app-release.apk
