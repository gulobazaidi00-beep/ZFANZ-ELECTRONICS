name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --project-name zfanz_electronics --org com.zfanz.electronics
          fi
          mkdir -p android/app/src/main/res/xml
          echo '<?xml version="1.0" encoding="utf-8"?><network-security-config><base-config cleartextTrafficPermitted="true"><trust-anchors><certificates src="system" /></trust-anchors></base-config></network-security-config>' > android/app/src/main/res/xml/network_security_config.xml
          sed -i 's/<application/<application android:hardwareAccelerated="true" android:usesCleartextTraffic="true" android:networkSecurityConfig="@xml\/network_security_config" /' android/app/src/main/AndroidManifest.xml || true
          grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml || sed -i '0,/<manifest.*>/{s/<manifest.*>/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">\n    <uses-permission android:name="android.permission.INTERNET" \/>/}' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: zfanz-apk
          path: build/app/outputs/flutter-apk/app-release.apk
