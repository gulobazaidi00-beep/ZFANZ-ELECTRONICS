name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --project-name zfanz_electronics --org com.zfanz.electronics || true
          fi
          # Add internet for videos
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "INTERNET" "$MANIFEST"; then
            sed -i 's/<manifest.*>/&\n    <uses-permission android:name="android.permission.INTERNET" \/>/' "$MANIFEST" || true
          fi
          # Only copy icon if it's a real PNG
          if [ -f "assets/icon.png" ] && file assets/icon.png | grep -q "PNG"; then
            for d in android/app/src/main/res/mipmap-*; do cp assets/icon.png "$d/ic_launcher.png" || true; done
            echo "Icon copied OK"
          else
            echo "Skipping icon - not a valid PNG, using Flutter default"
          fi
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: zfanz-apk
          path: build/app/outputs/flutter-apk/app-release.apk
